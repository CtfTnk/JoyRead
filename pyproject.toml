[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joyread"
version = "1.0.1"
description = "Cross-platform desktop manga and light novel reader."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "Pillow>=11.0",
    "PySide6>=6.7",
    "py7zr>=1.1",
    "pyzipper>=0.3",
    "platformdirs>=4.2",
    "rarfile>=4.2",
    "natsort>=8.4",
    # Romanize Japanese/Chinese tag names so they index onto the same A-Z rail
    # as Latin ones (joyread.core.tag_indexing). pykakasi 2.x is required for
    # its ``convert()`` API; 1.x used a different ``getConverter()`` entry.
    "pykakasi>=2.2",
    "pypinyin>=0.53",
    "pyobjc-core>=12.2.1,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.2.1,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# The novel (EPUB) reader. Only joyread.novel needs lxml, and that package is
# imported solely by the composition root when EPUB_ACCESS_ENABLED is on, so a
# build without this extra is a complete, working app.
epub = [
    "lxml>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "psutil>=6.0",
]
release = [
    "pyinstaller>=6.21,<7",
    # The .dmg layout. Writes the Finder .DS_Store itself through ds_store and
    # mac_alias rather than driving Finder over AppleScript, which is what lets
    # the disk image be built headlessly.
    "dmgbuild>=1.6.7,<2; sys_platform == 'darwin'",
]

[project.scripts]
joyread = "joyread.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
joyread = [
    "ui/resources/styles/*.qss",
    "ui/resources/icons/*",
    "ui/resources/fonts/*",
    "resources/locales/*.json",
    "resources/extractors/7zip/*",
    "resources/extractors/7zip/*/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
