[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joyread"
version = "0.1.0"
description = "Cross-platform desktop manga and light novel reader."
readme = "docs/CODEX_MAIN_UI_BRIEF.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0",
    "PySide6>=6.7",
    "py7zr>=1.1",
    "pyzipper>=0.3",
    "platformdirs>=4.2",
    "rarfile>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
joyread = "joyread.app.main:main"
joyread-button-tester = "joyread.app.button_tester:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
joyread = [
    "data_set/*",
    "ui/resources/styles/*.qss",
    "ui/resources/icons/*",
    "ui/resources/fonts/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
