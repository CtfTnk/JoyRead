name: Tests

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Both halves of the novel-reader split stay on the shipping macOS
          # target. Linux and Windows add platform/runtime coverage without
          # tripling the optional EPUB leg.
          - os: macos-14
            extras: dev,epub
            label: macOS (EPUB enabled)
          - os: macos-14
            extras: dev
            label: macOS (shipping configuration)
          - os: ubuntu-24.04
            extras: dev
            label: Linux x86-64
          - os: ubuntu-24.04-arm
            extras: dev
            label: Linux ARM64
          - os: windows-latest
            extras: dev
            label: Windows x86-64

    name: test (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[${{ matrix.extras }}]'

      - name: Confirm lxml is absent
        if: matrix.extras == 'dev'
        # The whole point of this leg. A transitive dependency quietly pulling
        # lxml back in would make the run pass while proving nothing.
        run: >-
          python -c "import importlib.util;
          assert importlib.util.find_spec('lxml') is None,
          'lxml is installed; this leg cannot prove the app runs without it';
          print('lxml absent, as required')"

      - name: Confirm the bundled 7-Zip helper is executable
        # Resolve exactly as the app does, require the bundled candidate (not a
        # host PATH fallback), and execute it. On Ubuntu this proves each
        # checked-in static Linux ELF and its executable bit on native x86-64
        # and ARM64 runners.
        run: >-
          python -c "import subprocess;
          from joyread.core.archive.backends import ExtractionBackendResolver;
          backend=ExtractionBackendResolver().seven_zip();
          assert backend is not None and backend.source.startswith('bundled:'), backend;
          subprocess.run([backend.executable, 'i'], check=True,
          stdout=subprocess.DEVNULL)"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        # -rs so the "dev" leg reports tests/novel/ as skipped rather than
        # silently collecting nothing there.
        run: python -m pytest -q -rs
