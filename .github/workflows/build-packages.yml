name: Build packages
run-name: Packages from ${{ github.ref_name }} (${{ inputs.platform }})

# Intentionally manual: commits, pushes and tags never package or publish.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platforms
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - ubuntu

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          TARGET: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = [
              {'platform': 'macos', 'os': 'macos-14', 'label': 'macos-arm64'},
              {'platform': 'windows', 'os': 'windows-latest', 'label': 'windows-x86_64'},
              {'platform': 'ubuntu', 'os': 'ubuntu-22.04', 'label': 'linux-amd64'},
              {'platform': 'ubuntu', 'os': 'ubuntu-22.04-arm', 'label': 'linux-arm64'},
          ]
          selected = [t for t in targets if os.environ['TARGET'] in ('all', t['platform'])]
          if not selected:
              raise SystemExit('No matching build targets')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': selected}) + '\n')
          PY

  package:
    needs: targets
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # All jobs build the dispatch SHA, even if the branch advances.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Isolate runtime data
        run: echo "JOYREAD_RUNTIME_DIR=$RUNNER_TEMP/joyread-build-runtime" >> "$GITHUB_ENV"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: '3.12.9'
          activate-environment: joyread-build
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate-base: false

      - name: Install Linux build and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libwayland-client0 libwayland-cursor0 \
            libxcb-cursor0 desktop-file-utils shared-mime-info fakeroot

      - name: Select the Conda C++ runtime for Linux builds
        if: runner.os == 'Linux'
        run: echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,release]'
          python -c "import importlib.util; assert importlib.util.find_spec('lxml') is None, 'Shipping build must not include EPUB dependencies'"

      - name: Install verified Inno Setup 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno Setup installer checksum mismatch'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          "JOYREAD_INNO_ISCC=$installDir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Test shipping configuration
        run: python -m pytest -q -rs

      - name: Build application
        run: python scripts/build_release.py --skip-tests

      - name: Package macOS
        if: runner.os == 'macOS'
        run: python scripts/build_dmg.py

      - name: Package Windows
        if: runner.os == 'Windows'
        run: python scripts/build_windows_inno.py --skip-app-build

      - name: Package Ubuntu
        if: runner.os == 'Linux'
        run: python scripts/build_linux_deb.py --skip-app-build

      - name: Verify installed Ubuntu package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          python scripts/verify_linux_package.py /opt/joyread

      - name: Record version, commit and checksums
        env:
          BUILD_TARGET: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          packages = [p for pattern in ('*.dmg', '*.deb', '*-setup.exe') for p in Path('dist').glob(pattern)]
          if len(packages) != 1:
              raise SystemExit(f'Expected exactly one installer, found {packages}')
          metadata = {'version': version, 'commit': os.environ['GITHUB_SHA'], 'target': os.environ['BUILD_TARGET'], 'python': platform.python_version()}
          if platform.system() == 'Linux':
              import subprocess
              from importlib.metadata import version as dependency_version
              metadata.update(os=platform.freedesktop_os_release()['PRETTY_NAME'], glibc=platform.libc_ver()[1], pyside6=dependency_version('PySide6'), debian_version=subprocess.check_output(['dpkg-deb', '-f', str(packages[0]), 'Version'], text=True).strip())
          checksums = []
          for package in packages:
              with package.open('rb') as source:
                  checksum = hashlib.file_digest(source, 'sha256').hexdigest()
              checksums.append(f'{checksum}  {package.name}\n')
          Path('dist/SHA256SUMS').write_text(''.join(checksums), encoding='utf-8')
          Path('dist/build-info.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Built **{packages[0].name}** from `{metadata['commit']}`.\n\nDownload the artifact below. No Release was created.\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: JoyRead-${{ matrix.label }}-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*-setup.exe
            dist/SHA256SUMS
            dist/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
